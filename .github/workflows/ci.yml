name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install backend security tools
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go tests
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...

      - name: Run gosec
        run: ${{ github.workspace }}/.bin/gosec ./...

      - name: Run govulncheck
        run: ${{ github.workspace }}/.bin/govulncheck ./...

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web-app
        run: npm test

      - name: Build frontend
        working-directory: frontend/web-app
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_PUBLIC_SECRET_ORIGIN: http://127.0.0.1:4173
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend/web-app
        run: npm audit --omit=dev

  deploy-artifacts:
    name: Deploy Artifact Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render shared-edge Compose config
        run: |
          cp deploy/prod/.env.vps-edge.example deploy/prod/.env
          trap 'rm -f deploy/prod/.env' EXIT
          docker compose \
            -f deploy/prod/docker-compose.yml \
            -f deploy/prod/docker-compose.vps-edge.yml \
            config

      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh deploy/prod/init-vps.sh

      - name: Validate staging deploy helper
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          mkdir -p "$tmpdir/source/repo" "$tmpdir/backend" "$tmpdir/frontend/dist"
          printf 'release-source\n' > "$tmpdir/source/repo/README.txt"
          printf 'backend-binary\n' > "$tmpdir/backend/secret-letter-api-linux-amd64"
          printf '<!doctype html>\n' > "$tmpdir/frontend/dist/index.html"
          printf 'placeholder-key\n' > "$tmpdir/staging_key"
          chmod 600 "$tmpdir/staging_key"

          tar -czf "$tmpdir/secret-letter-source-test.tar.gz" -C "$tmpdir/source" repo
          tar -czf "$tmpdir/secret-letter-api-test.tar.gz" -C "$tmpdir/backend" secret-letter-api-linux-amd64
          tar -czf "$tmpdir/secret-letter-web-test.tar.gz" -C "$tmpdir/frontend" dist

          TMPDIR_PATH="$tmpdir" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TMPDIR_PATH"])
          artifact_specs = [
              ("backend", "secret-letter-api-test.tar.gz"),
              ("frontend", "secret-letter-web-test.tar.gz"),
              ("source", "secret-letter-source-test.tar.gz"),
          ]

          def sha256sum(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = {
              "version": "test-release",
              "artifacts": [],
          }

          for kind, filename in artifact_specs:
              path = root / filename
              manifest["artifacts"].append(
                  {
                      "name": filename,
                      "kind": kind,
                      "sha256": sha256sum(path),
                      "size_bytes": path.stat().st_size,
                  }
              )

          (root / "release-manifest-test.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

          (
            cd "$tmpdir"
            sha256sum \
              secret-letter-api-test.tar.gz \
              secret-letter-web-test.tar.gz \
              secret-letter-source-test.tar.gz \
              release-manifest-test.json \
              > release-checksums-test.txt
          )

          DRY_RUN=1 \
          STAGING_SSH_HOST=staging.example.com \
          STAGING_SSH_USER=deploy \
          STAGING_SSH_PRIVATE_KEY_FILE="$tmpdir/staging_key" \
          STAGING_DEPLOY_PATH=/opt/secret-letter-staging \
          STAGING_REMOTE_DEPLOY_COMMAND='echo deploy' \
          STAGING_REMOTE_POST_DEPLOY_COMMAND='echo smoke' \
          STAGING_KEEP_RELEASES=4 \
          STAGING_RELEASE_VERSION=test-release \
          STAGING_SOURCE_ARCHIVE="$tmpdir/secret-letter-source-test.tar.gz" \
          STAGING_BACKEND_ARCHIVE="$tmpdir/secret-letter-api-test.tar.gz" \
          STAGING_FRONTEND_ARCHIVE="$tmpdir/secret-letter-web-test.tar.gz" \
          STAGING_RELEASE_MANIFEST="$tmpdir/release-manifest-test.json" \
          STAGING_RELEASE_CHECKSUMS="$tmpdir/release-checksums-test.txt" \
          bash ./scripts/deploy-staging.sh

      - name: Validate deployment PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }

      - name: Validate Caddy config
        run: |
          docker run --rm \
            -v "$PWD/deploy/prod/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build API container image
        run: docker build -t secret-letter-api-ci .

  e2e:
    name: E2E Flow
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - deploy-artifacts
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/web-app
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Run end-to-end flow
        working-directory: frontend/web-app
        env:
          REDIS_ADDR: 127.0.0.1:6379
          E2E_REDIS_ADDR: 127.0.0.1:6379
        run: npm run test:e2e
