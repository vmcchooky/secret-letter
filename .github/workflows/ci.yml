name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web-app
        run: npm test

      - name: Build frontend
        working-directory: frontend/web-app
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

  e2e:
    name: E2E Flow
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/web-app
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Run end-to-end flow
        working-directory: frontend/web-app
        env:
          REDIS_ADDR: 127.0.0.1:6379
          E2E_REDIS_ADDR: 127.0.0.1:6379
        run: npm run test:e2e
