name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install backend security tools
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go tests
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...

      - name: Run gosec
        run: ${{ github.workspace }}/.bin/gosec ./...

      - name: Run govulncheck
        run: ${{ github.workspace }}/.bin/govulncheck ./...

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web-app
        run: npm test

      - name: Build frontend
        working-directory: frontend/web-app
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
          VITE_PUBLIC_SECRET_ORIGIN: http://127.0.0.1:4173
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend/web-app
        run: npm audit --omit=dev

  deploy-artifacts:
    name: Deploy Artifact Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render shared-edge Compose config
        run: |
          cp deploy/prod/.env.vps-edge.example deploy/prod/.env
          trap 'rm -f deploy/prod/.env' EXIT
          docker compose \
            -f deploy/prod/docker-compose.yml \
            -f deploy/prod/docker-compose.vps-edge.yml \
            config

      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh deploy/prod/init-vps.sh

      - name: Validate deployment PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }

      - name: Validate Caddy config
        run: |
          docker run --rm \
            -v "$PWD/deploy/prod/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build API container image
        run: docker build -t secret-letter-api-ci .

  e2e:
    name: E2E Flow
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - deploy-artifacts
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/web-app
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Run end-to-end flow
        working-directory: frontend/web-app
        env:
          REDIS_ADDR: 127.0.0.1:6379
          E2E_REDIS_ADDR: 127.0.0.1:6379
        run: npm run test:e2e
