name: CD

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, or tag to build
        required: true
        default: main
        type: string
      deploy_staging:
        description: Run the gated staging deployment job after build
        required: true
        default: false
        type: boolean
      vite_api_base_url:
        description: Optional frontend API base URL override for manual builds
        required: false
        default: ""
        type: string
      vite_public_secret_origin:
        description: Optional frontend public secret origin override for manual builds
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    name: Build Release Assets
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      backend_archive_name: ${{ steps.meta.outputs.backend_archive_name }}
      frontend_archive_name: ${{ steps.meta.outputs.frontend_archive_name }}
      source_archive_name: ${{ steps.meta.outputs.source_archive_name }}
      manifest_name: ${{ steps.meta.outputs.manifest_name }}
      checksums_name: ${{ steps.meta.outputs.checksums_name }}
      vite_api_base_url: ${{ steps.meta.outputs.vite_api_base_url }}
      vite_public_secret_origin: ${{ steps.meta.outputs.vite_public_secret_origin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            short_sha="$(git rev-parse --short HEAD)"
            sanitized_ref="$(printf '%s' "${{ inputs.ref }}" | tr '/:@ ' '-' | tr -cd 'A-Za-z0-9._-')"
            version="${sanitized_ref}-${short_sha}"
          fi

          default_vite_api_base_url="${{ vars.CD_VITE_API_BASE_URL || 'https://api.secret.quorix.io.vn' }}"
          default_vite_public_secret_origin="${{ vars.CD_VITE_PUBLIC_SECRET_ORIGIN || 'https://secret.quorix.io.vn' }}"
          vite_api_base_url="${default_vite_api_base_url}"
          vite_public_secret_origin="${default_vite_public_secret_origin}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.vite_api_base_url }}" ]]; then
              vite_api_base_url="${{ inputs.vite_api_base_url }}"
            fi
            if [[ -n "${{ inputs.vite_public_secret_origin }}" ]]; then
              vite_public_secret_origin="${{ inputs.vite_public_secret_origin }}"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=release-assets-$version" >> "$GITHUB_OUTPUT"
          echo "backend_archive_name=secret-letter-api-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "frontend_archive_name=secret-letter-web-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "source_archive_name=secret-letter-source-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "manifest_name=release-manifest-$version.json" >> "$GITHUB_OUTPUT"
          echo "checksums_name=release-checksums-$version.txt" >> "$GITHUB_OUTPUT"
          echo "vite_api_base_url=$vite_api_base_url" >> "$GITHUB_OUTPUT"
          echo "vite_public_secret_origin=$vite_public_secret_origin" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Install backend security tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build backend release package
        shell: bash
        env:
          REDIS_ADDR: 127.0.0.1:6379
          REQUIRE_SECURITY_TOOLS: "1"
        run: bash ./scripts/build-production.sh

      - name: Build frontend release dist
        working-directory: frontend/web-app
        env:
          VITE_API_BASE_URL: ${{ steps.meta.outputs.vite_api_base_url }}
          VITE_PUBLIC_SECRET_ORIGIN: ${{ steps.meta.outputs.vite_public_secret_origin }}
        run: npm run build

      - name: Package release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BACKEND_ARCHIVE_NAME: ${{ steps.meta.outputs.backend_archive_name }}
          FRONTEND_ARCHIVE_NAME: ${{ steps.meta.outputs.frontend_archive_name }}
          SOURCE_ARCHIVE_NAME: ${{ steps.meta.outputs.source_archive_name }}
          MANIFEST_NAME: ${{ steps.meta.outputs.manifest_name }}
          CHECKSUMS_NAME: ${{ steps.meta.outputs.checksums_name }}
          VITE_API_BASE_URL: ${{ steps.meta.outputs.vite_api_base_url }}
          VITE_PUBLIC_SECRET_ORIGIN: ${{ steps.meta.outputs.vite_public_secret_origin }}
        run: |
          set -euo pipefail

          mv "build/secret-letter-api-$(git describe --tags --always --dirty 2>/dev/null || echo dev).tar.gz" "build/$BACKEND_ARCHIVE_NAME"
          tar -czf "build/$FRONTEND_ARCHIVE_NAME" -C frontend/web-app dist
          git archive --format=tar.gz --output "build/$SOURCE_ARCHIVE_NAME" HEAD

          python - <<'PY'
          import json
          import os
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          build_dir = Path("build")

          def sha256sum(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          artifact_specs = [
              ("backend", os.environ["BACKEND_ARCHIVE_NAME"]),
              ("frontend", os.environ["FRONTEND_ARCHIVE_NAME"]),
              ("source", os.environ["SOURCE_ARCHIVE_NAME"]),
          ]

          artifacts = []
          for kind, filename in artifact_specs:
              path = build_dir / filename
              artifacts.append(
                  {
                      "name": filename,
                      "kind": kind,
                      "sha256": sha256sum(path),
                      "size_bytes": path.stat().st_size,
                  }
              )

          manifest = {
              "version": os.environ["VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "frontend_build": {
                  "vite_api_base_url": os.environ["VITE_API_BASE_URL"],
                  "vite_public_secret_origin": os.environ["VITE_PUBLIC_SECRET_ORIGIN"],
              },
              "artifacts": artifacts,
          }
          (build_dir / os.environ["MANIFEST_NAME"]).write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )
          PY

          (
            cd build
            sha256sum \
              "$BACKEND_ARCHIVE_NAME" \
              "$FRONTEND_ARCHIVE_NAME" \
              "$SOURCE_ARCHIVE_NAME" \
              "$MANIFEST_NAME" \
              > "$CHECKSUMS_NAME"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          retention-days: 30
          path: |
            build/${{ steps.meta.outputs.backend_archive_name }}
            build/${{ steps.meta.outputs.frontend_archive_name }}
            build/${{ steps.meta.outputs.source_archive_name }}
            build/${{ steps.meta.outputs.manifest_name }}
            build/${{ steps.meta.outputs.checksums_name }}

  publish-release-assets:
    name: Publish GitHub Release Assets
    if: github.event_name == 'release'
    needs: build-release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-assets.outputs.artifact_name }}
          path: release-assets

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  deploy-staging:
    name: Deploy Staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
    needs: build-release-assets
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-assets.outputs.artifact_name }}
          path: release-assets

      - name: Prepare staging SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ssh"
          printf '%s\n' "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > "${{ runner.temp }}/ssh/staging_key"
          chmod 600 "${{ runner.temp }}/ssh/staging_key"
          if [[ -n "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" ]]; then
            printf '%s\n' "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > "${{ runner.temp }}/ssh/known_hosts"
            chmod 600 "${{ runner.temp }}/ssh/known_hosts"
          fi

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_REMOTE_DEPLOY_COMMAND: ${{ vars.STAGING_REMOTE_DEPLOY_COMMAND }}
        run: |
          set -euo pipefail
          required_vars=(
            STAGING_SSH_HOST
            STAGING_SSH_USER
            STAGING_REMOTE_DEPLOY_COMMAND
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required staging configuration: $name" >&2
              exit 1
            fi
          done

      - name: Run gated staging deployment
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/secret-letter-staging' }}
          STAGING_REMOTE_DEPLOY_COMMAND: ${{ vars.STAGING_REMOTE_DEPLOY_COMMAND }}
          STAGING_REMOTE_POST_DEPLOY_COMMAND: ${{ vars.STAGING_REMOTE_POST_DEPLOY_COMMAND }}
          STAGING_KEEP_RELEASES: ${{ vars.STAGING_KEEP_RELEASES || '5' }}
          STAGING_RELEASE_VERSION: ${{ needs.build-release-assets.outputs.version }}
          STAGING_BACKEND_ARCHIVE: ${{ github.workspace }}/release-assets/${{ needs.build-release-assets.outputs.backend_archive_name }}
          STAGING_FRONTEND_ARCHIVE: ${{ github.workspace }}/release-assets/${{ needs.build-release-assets.outputs.frontend_archive_name }}
          STAGING_SOURCE_ARCHIVE: ${{ github.workspace }}/release-assets/${{ needs.build-release-assets.outputs.source_archive_name }}
          STAGING_RELEASE_MANIFEST: ${{ github.workspace }}/release-assets/${{ needs.build-release-assets.outputs.manifest_name }}
          STAGING_RELEASE_CHECKSUMS: ${{ github.workspace }}/release-assets/${{ needs.build-release-assets.outputs.checksums_name }}
          STAGING_SSH_PRIVATE_KEY_FILE: ${{ runner.temp }}/ssh/staging_key
          STAGING_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh/known_hosts
        run: bash ./scripts/deploy-staging.sh
