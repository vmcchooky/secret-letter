services:
  api:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: secret-letter-api
    restart: always
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - REDIS_ADDR=redis:6379
      - RATE_LIMIT_ENABLED=true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: secret-letter-redis
    restart: always
    env_file:
      - .env
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: secret-letter-caddy
    profiles: ["bundled-edge"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  caddy_data:
  caddy_config:
